<svg width="1000" height="1000" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The seven steps of the Grand Slam Offer audit">
  <defs>
    <clipPath id="steps-clip"><rect x="0" y="0" width="1000" height="1000"/></clipPath>
  </defs>
  <g clip-path="url(#steps-clip)">
    <rect x="0" y="0" width="1000" height="1000" fill="#EFEAE0"/>

    <!-- header -->
    <text x="60" y="62" font-family="'Zilla Slab','Roboto Slab',Georgia,serif" font-weight="700" font-size="30" fill="#18120D">The seven steps, in order</text>
    <text x="60" y="88" font-family="Georgia,serif" font-style="italic" font-size="16" fill="#5B5042">Each step stops for your review before the skill moves to the next one.</text>
    <line x1="60" y1="106" x2="940" y2="106" stroke="#18120D" stroke-width="1" opacity="0.25"/>

    <!-- binding spine -->
    <line x1="60" y1="140" x2="60" y2="960" stroke="#C7563F" stroke-width="1.5" opacity="0.35"/>
    <g fill="#C7563F" opacity="0.45">
      <circle cx="60" cy="160" r="3"/>
      <circle cx="60" cy="280" r="3"/>
      <circle cx="60" cy="400" r="3"/>
      <circle cx="60" cy="520" r="3"/>
      <circle cx="60" cy="640" r="3"/>
      <circle cx="60" cy="760" r="3"/>
      <circle cx="60" cy="880" r="3"/>
    </g>

    <!-- row template repeated: number block + title + body, divided by dashed tear-rule -->
    <g font-family="'IBM Plex Mono','Courier New',monospace">

      <!-- 01 -->
      <text x="90" y="168" font-size="34" font-weight="700" fill="#A4302A">01</text>
      <text x="170" y="158" font-family="'Zilla Slab','Roboto Slab',Georgia,serif" font-weight="700" font-size="21" fill="#18120D">Grand Slam Offer Architect</text>
      <text x="170" y="182" font-size="13.5" fill="#5B5042" font-family="Georgia,serif">Dream Outcome, Perceived Likelihood, Time Delay, Effort &amp; Sacrifice — shaped into one offer.</text>
      <line x1="60" y1="212" x2="940" y2="212" stroke="#18120D" stroke-width="1" stroke-dasharray="2 4" opacity="0.3"/>

      <!-- 02 -->
      <text x="90" y="288" font-size="34" font-weight="700" fill="#A4302A">02</text>
      <text x="170" y="278" font-family="'Zilla Slab','Roboto Slab',Georgia,serif" font-weight="700" font-size="21" fill="#18120D">Value Equation Optimizer</text>
      <text x="170" y="302" font-size="13.5" fill="#5B5042" font-family="Georgia,serif">Five ways to raise the numerator, five to shrink the denominator — all specific to the product.</text>
      <line x1="60" y1="332" x2="940" y2="332" stroke="#18120D" stroke-width="1" stroke-dasharray="2 4" opacity="0.3"/>

      <!-- 03 -->
      <text x="90" y="408" font-size="34" font-weight="700" fill="#A4302A">03</text>
      <text x="170" y="398" font-family="'Zilla Slab','Roboto Slab',Georgia,serif" font-weight="700" font-size="21" fill="#18120D">Lead Magnet Creation</text>
      <text x="170" y="422" font-size="13.5" fill="#5B5042" font-family="Georgia,serif">Solves the single most urgent problem, free, at close to zero delivery cost.</text>
      <line x1="60" y1="452" x2="940" y2="452" stroke="#18120D" stroke-width="1" stroke-dasharray="2 4" opacity="0.3"/>

      <!-- 04 -->
      <text x="90" y="528" font-size="34" font-weight="700" fill="#A4302A">04</text>
      <text x="170" y="518" font-family="'Zilla Slab','Roboto Slab',Georgia,serif" font-weight="700" font-size="21" fill="#18120D">Scarcity &amp; Urgency Mechanism</text>
      <text x="170" y="542" font-size="13.5" fill="#5B5042" font-family="Georgia,serif">Limited quantity, limited time, and a bonus that expires — each one justified, not forced.</text>
      <line x1="60" y1="572" x2="940" y2="572" stroke="#18120D" stroke-width="1" stroke-dasharray="2 4" opacity="0.3"/>

      <!-- 05 -->
      <text x="90" y="648" font-size="34" font-weight="700" fill="#A4302A">05</text>
      <text x="170" y="638" font-family="'Zilla Slab','Roboto Slab',Georgia,serif" font-weight="700" font-size="21" fill="#18120D">Direct-Response Copy ROI</text>
      <text x="170" y="662" font-size="13.5" fill="#5B5042" font-family="Georgia,serif">A hook, a sharp problem statement, and risk reversal that makes saying no illogical.</text>
      <line x1="60" y1="692" x2="940" y2="692" stroke="#18120D" stroke-width="1" stroke-dasharray="2 4" opacity="0.3"/>

      <!-- 06 -->
      <text x="90" y="768" font-size="34" font-weight="700" fill="#A4302A">06</text>
      <text x="170" y="758" font-family="'Zilla Slab','Roboto Slab',Georgia,serif" font-weight="700" font-size="21" fill="#18120D">Niching Down</text>
      <text x="170" y="782" font-size="13.5" fill="#5B5042" font-family="Georgia,serif">The sub-segment with the sharpest pain, the deepest pockets, and the easiest reach.</text>
      <line x1="60" y1="812" x2="940" y2="812" stroke="#18120D" stroke-width="1" stroke-dasharray="2 4" opacity="0.3"/>

      <!-- 07 -->
      <text x="90" y="888" font-size="34" font-weight="700" fill="#A4302A">07</text>
      <text x="170" y="878" font-family="'Zilla Slab','Roboto Slab',Georgia,serif" font-weight="700" font-size="21" fill="#18120D">Frictionless Conversion Path</text>
      <text x="170" y="902" font-size="13.5" fill="#5B5042" font-family="Georgia,serif">Every drop-off point between first contact and purchase, found and fixed.</text>
    </g>

    <line x1="60" y1="940" x2="940" y2="940" stroke="#18120D" stroke-width="1" opacity="0.25"/>
    <text x="940" y="964" text-anchor="end" font-family="'IBM Plex Mono','Courier New',monospace" font-size="11" fill="#5B5042" letter-spacing="0.5">context carries forward · one step at a time</text>
  </g>
</svg>
